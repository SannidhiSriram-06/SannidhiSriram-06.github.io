<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | Sannidhi Durga Pavan Sriram</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) { }
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <main class="wrap not-found">
    <h1>That page doesn't exist.</h1>
    <p>The link may be old or mistyped. The projects, certifications and contact details are all on the home page.</p>
    <p><a class="button button-primary" href="/">Back to the portfolio</a></p>
  </main>
</body>

</html>
